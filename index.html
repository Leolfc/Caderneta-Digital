<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cardeneta</title>
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
    <header>
      <h1>Padaria Bom Pão</h1>
      <div>
        <h4>Operador:
         <span>Teste</span>
        </h4>
       
        <span>Status:</span>
        <span>🟢Online</span>
      </div>
    </header>
    <main>
      <div class="container_search">
        <input id="search_input" type="text" placeholder="Pesquisar cliente" />
        <button class="search">Pesquisar</button>
      </div>

      <section class="name_client">
        <form action="">
          <div>
            <label for="client"
              >Nome do cliente
              <input
                type="text"
                id="client"
                placeholder="Digite o nome do cliente"
              />
            </label>
          </div>

          <div>
            <label for="value"
              >Valor
              <input
                type="number"
                id="value"
                placeholder="Digite o valor do pedido"
              />
            </label>
          </div>

          <button>Adicionar</button>
        </form>
       
      </section>
       <section class="container_value">
          <!-- <div class="container_dados_client">
            <h3>Leo</h3>
            <span>R$ 20,00</span>
          </div>
           <div>
            <h3>Gian</h3>
            <span>R$ 20,00</span>
          </div> -->
        </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
